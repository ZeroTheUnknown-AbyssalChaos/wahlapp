<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WahlApp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--pri:#18181b;--acc:#c8201e;--bgl:#f3f1ea;--onpri:#fff;--bg:light-dark(var(--bgl),#141416);--paper:light-dark(#fffefa,#1d1d21);--ink:light-dark(#18181b,#ecebe6);--mute:light-dark(#66645d,#a19f98);--line:light-dark(#d9d5c8,#34343a);--red:light-dark(var(--acc),color-mix(in srgb,var(--acc) 45%,#fff));--redbg:light-dark(color-mix(in srgb,var(--acc) 11%,#fff),color-mix(in srgb,var(--acc) 30%,#141416));--ok:light-dark(#1d5fa8,#7fb2ff)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Archivo,system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:780px;margin:0 auto;padding:clamp(18px,4vw,44px) max(4vw,14px) 60px}
.band{background:var(--pri);color:var(--onpri)}
.band .wrap{padding-bottom:22px}.band .who{color:inherit;opacity:.82}.band .chip{color:var(--onpri)}
.wrap.body{padding-top:20px}
.sw{display:inline-flex;gap:0;border-radius:6px;overflow:hidden;border:1px solid var(--line);flex:none}.sw i{width:22px;height:30px}
input[type=color]{width:56px;min-height:44px;padding:3px}
header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
h1{font-size:clamp(30px,6vw,46px);line-height:1.05;margin:0;font-weight:800;text-wrap:balance}
h2{font-size:21px;margin:0 0 12px}
.who{color:var(--mute);font-size:14px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:99px;font-size:14px;font-weight:600;border:1.5px solid currentColor;white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;background:currentColor}
.chip.plain{color:var(--ink);border-width:1px;font-weight:400}
.s-running{color:var(--red)}.s-paused,.s-setup{color:var(--mute)}.s-ended,.s-published{color:var(--ok)}
.tabs{display:flex;gap:6px;margin:6px 0 18px;flex-wrap:wrap}
.tabs button{background:none;border:1.5px solid var(--line);color:var(--ink)}
.tabs button[aria-selected=true]{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.tabs .out{margin-left:auto}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:clamp(18px,3.5vw,32px);box-shadow:0 1px 0 var(--line),0 12px 30px -18px #0004;margin-bottom:18px;position:relative}
.sheet.ballot{border-top:6px solid var(--pri)}
.hint{color:var(--mute);font-size:15px;margin:0 0 14px}
button{font:inherit;font-weight:600;min-height:44px;padding:8px 18px;border-radius:6px;border:0;background:var(--ink);color:var(--paper);cursor:pointer}
button.red{background:var(--pri);color:var(--onpri);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--pri) 70%,#fff)}
button.ghost{background:none;color:var(--ink);border:1.5px solid var(--line)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ok);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.cands{list-style:none;margin:0;padding:0}
.cand{display:flex;align-items:center;gap:14px;padding:12px 4px;border-bottom:1px dashed var(--line);cursor:pointer;min-height:56px}
.cand:last-child{border-bottom:0}.cand.off{cursor:default}
.box{flex:none;width:34px;height:34px;border:2.5px solid var(--ink);border-radius:4px;display:grid;place-items:center;font-weight:800;font-size:18px;color:var(--red)}
.cand.sel .box{border-color:var(--red)}
.cname{font-weight:600;font-size:17px}.cinfo{color:var(--mute);font-size:14px}
.mini{min-height:36px;padding:4px 10px;font-size:14px}
label{display:block;font-weight:600;font-size:14px;margin:0 0 6px}
input,select{font:inherit;font-size:16px;width:100%;min-height:44px;padding:8px 12px;border:1.5px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
input.code{text-transform:uppercase;letter-spacing:.18em;font-weight:700;font-size:22px;max-width:260px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-bottom:16px}
.seg{display:flex;border:1.5px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{flex:1;border-radius:0;background:none;color:var(--ink);padding:8px 6px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.edit{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) auto;gap:8px;margin-bottom:8px}
.stamp{position:absolute;right:22px;top:18px;transform:rotate(-8deg);border:3px solid var(--red);color:var(--red);font-weight:800;padding:6px 14px;border-radius:6px;font-size:20px;animation:st .35s ease-out}
@keyframes st{from{transform:rotate(-8deg) scale(1.8);opacity:0}}
@media(prefers-reduced-motion:reduce){.stamp{animation:none}}
.res{display:grid;grid-template-columns:2.2em minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.res .rk{font-weight:800;font-size:20px;color:var(--mute)}.res.win .rk{color:var(--red)}
.bar{grid-column:2/4;height:10px;background:var(--bg);border-radius:5px;overflow:hidden}
.bar b{display:block;height:100%;background:var(--ink)}.res.win .bar b{background:var(--red)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.big{font-size:clamp(34px,8vw,52px);font-weight:800;line-height:1}
.ctrl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.note{background:var(--redbg);border-radius:6px;padding:10px 14px;font-size:15px;margin-bottom:14px}
.switch{display:flex;gap:10px;align-items:center;font-weight:600;cursor:pointer;margin:0 0 10px}
.switch input{width:22px;min-height:22px;height:22px;flex:none}
.list .it{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}
.roomcode{display:flex;flex-wrap:wrap;gap:20px;align-items:center}
.roomcode .c{font-size:clamp(40px,10vw,64px);font-weight:800;letter-spacing:.08em;line-height:1;font-variant-numeric:tabular-nums}
#qr{background:#fff;padding:8px;border-radius:6px;width:156px;height:156px}
#qr img,#qr canvas{width:140px!important;height:140px!important}
.stats{display:flex;flex-wrap:wrap;gap:24px;margin-bottom:16px}
dialog{border:0;border-radius:8px;padding:24px;max-width:min(440px,92vw);background:var(--paper);color:var(--ink);box-shadow:0 20px 60px #0006}
dialog::backdrop{background:#0007}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:6px;font-size:15px;display:none;z-index:9;max-width:90vw}
#proto{display:none}
@media print{
  body{background:#fff;color:#000;font-size:11pt}
  .wrap,dialog,.toast{display:none!important}
  #proto{display:block;color:#000}
  #proto h1{font-size:20pt;margin:0 0 4pt}#proto h2{font-size:13pt;margin:16pt 0 6pt}
  #proto table{width:100%;border-collapse:collapse;font-size:10.5pt}
  #proto th,#proto td{border:1px solid #888;padding:4pt 6pt;text-align:left;vertical-align:top}
  #proto td.n{text-align:right;font-variant-numeric:tabular-nums}
  #proto .meta td:first-child{width:38%;font-weight:600}
  #proto .sig{display:grid;grid-template-columns:1fr 1fr;gap:30pt;margin-top:40pt}
  #proto .sig div{border-top:1px solid #000;padding-top:4pt;font-size:9.5pt}
  #proto tr{break-inside:avoid}
  @page{margin:16mm}
}
@media(max-width:600px){.grid{grid-template-columns:minmax(0,1fr)}.edit{grid-template-columns:minmax(0,1fr) auto}.edit input.info{grid-row:2}.stamp{font-size:16px;right:12px;top:10px}.tabs .out{margin-left:0}}
</style>
</head>
<body>
<div class="band"><div class="wrap">
  <header style="margin:0">
    <div><div class="who" id="who">Wird geladen …</div><h1 id="title">WahlApp</h1></div>
    <span id="chip"></span>
  </header>
</div></div>
<div class="wrap body">
  <nav class="tabs" id="tabs" hidden></nav>
  <main id="main"><div class="sheet"><p class="hint">Wird geladen …</p></div></main>
</div>
<dialog id="dlg"><h2 id="dT"></h2><p id="dB" class="hint"></p><div class="row" style="justify-content:flex-end"><button class="ghost" id="dNo">Abbrechen</button><button class="red" id="dYes">Bestätigen</button></div></dialog>
<div class="toast" id="toast"></div>
<div id="proto"></div>

<script type="module">
/* ======== FIREBASE-DATEN ======== */
const firebaseConfig = {
  apiKey: "AIzaSyA10hNmPw8T75pfGyFankDJi-G9pn276r8",
  authDomain: "wahlapp.firebaseapp.com",
  projectId: "wahlapp",
  appId: "1:739177123054:web:29127a0d7ddc3cd46137ff"
};
const SUPER_UID = "mmIhMZAUeOVJ917jU2SmDKsM6dm2"; // Hauptwahlleiter (du): verwaltet alle Wähler, Wahlleiter und Designs
/* ================================= */

const B='https://www.gstatic.com/firebasejs/10.12.2/';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LABEL={setup:'In Vorbereitung',running:'Wahl läuft',paused:'Pausiert',ended:'Beendet',published:'Ergebnis veröffentlicht'};
const ALPH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const norm=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const fmtCode=c=>c?c.slice(0,3)+'-'+c.slice(3):'';
const fmt=t=>t?new Date(t).toLocaleString('de-DE',{dateStyle:'medium',timeStyle:'short'}):'–';
const rnd=n=>{const a=new Uint32Array(n);crypto.getRandomValues(a);return[...a].map(x=>ALPH[x%ALPH.length]).join('')};
const ls={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

let F,A,D,app,auth,fs,secAuth=null;
/* ---------- Designs ---------- */
const PRESETS=[
  {key:'standard',name:'Standard',app:'WahlApp',pri:'#18181b',acc:'#c8201e',bg:'#f3f1ea'},
  {key:'thw',name:'THW (Blau/Weiß)',app:'THW-Wahl',pri:'#003399',acc:'#003399',bg:'#eef1f8'},
  {key:'verein',name:'Verein (Grün/Braun)',app:'Vereinswahl',pri:'#2e4d2e',acc:'#8a5a2b',bg:'#f1f0e4'}];
const HEX=/^#[0-9a-f]{6}$/i,okHex=(v,f)=>HEX.test(v||'')?v:f;
const lum=hex=>{const c=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)/255).map(v=>v<=.03928?v/12.92:((v+.055)/1.055)**2.4);return .2126*c[0]+.7152*c[1]+.0722*c[2]};
let appName='WahlApp',themes=[],themeId=null,themeUnsub=null,tDraft=null,curTheme=null;
function applyTheme(t){
  const d=PRESETS[0];t=t||d;const st=document.documentElement.style;
  const pri=okHex(t.pri,d.pri);
  st.setProperty('--pri',pri);st.setProperty('--acc',okHex(t.acc,d.acc));st.setProperty('--bgl',okHex(t.bg,d.bg));
  st.setProperty('--onpri',lum(pri)>.45?'#111':'#fff');
  appName=String(t.app||'').trim()||d.app;document.title=appName;
  try{localStorage.setItem('wa_theme',JSON.stringify({pri:t.pri,acc:t.acc,bg:t.bg,app:t.app}))}catch(e){}
}
try{applyTheme(JSON.parse(localStorage.getItem('wa_theme')))}catch(e){applyTheme(null)}
function watchTheme(id){
  if(id===themeId)return;themeId=id;if(themeUnsub){themeUnsub();themeUnsub=null}
  if(!id){curTheme=null;if(!tDraft)applyTheme(null);return}
  themeUnsub=D.onSnapshot(D.doc(fs,'themes',id),s=>{curTheme=s.exists()?s.data():null;if(!tDraft)applyTheme(curTheme);render()},()=>{curTheme=null;if(!tDraft)applyTheme(null);render()});
}
const themeName=id=>!id?'Standard':themes.find(t=>t._id===id)?.name||'(Design)';
const themeOpts=(sel,ids)=>`<option value="">Standard</option>${themes.filter(t=>!ids||ids.includes(t._id)).map(t=>`<option value="${esc(t._id)}" ${t._id===sel?'selected':''}>${esc(t.name)}</option>`).join('')}`;
/* ---------- Gruppen ---------- */
let groups=[];
const grpOf=id=>groups.find(g=>g._id===id);
const myGroupIds=()=>prof?.groups||[];
const leadGroups=()=>isSup?groups:groups.filter(g=>(g.leaders||[]).includes(me?.uid));
const myThemeIds=()=>[...new Set(groups.filter(g=>myGroupIds().includes(g._id)||(g.leaders||[]).includes(me?.uid)).map(g=>g.theme).filter(Boolean))];
function desiredTheme(){ // im Raum: Design der Gruppe; sonst eigenes (aus den eigenen Gruppen)
  const room=page==='room'?aRoom:(page==='vote'&&vCode?vRoom:null);
  if(room?.group){const g=grpOf(room.group);return g?.theme||null}
  const mine=myThemeIds();
  if(prof?.theme&&(isSup||mine.includes(prof.theme)))return prof.theme;
  return mine[0]||null;
}
const swatch=t=>`<span class="sw" aria-hidden="true"><i style="background:${okHex(t.pri,'#18181b')}"></i><i style="background:${okHex(t.acc,'#c8201e')}"></i><i style="background:${okHex(t.bg,'#f3f1ea')}"></i></span>`;
let me=null,prof=null,authReady=false,isSup=false,isAdm=false;
let page='vote',busy=false,draft=null;
// Wähler-Sicht
let vJoinCode=null,vCode=null,vRoom=null,vMember=null,vVote=null,vRes=null,vUnsub=[],vLoaded=false,vJoined=false;
let pick=[],editing=false;
// Admin-Sicht
let myRooms=[],aCode=null,aRoom=null,aMembers=[],aVotes=[],aRes=null,aUnsub=[],staff=[],archive=[],gUnsub=[];
const pendingRoom=norm(new URLSearchParams(location.search).get('r'));

function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3400)}
function ask(title,body,yes='Bestätigen',no='Abbrechen'){return new Promise(r=>{const d=$('dlg');$('dT').textContent=title;$('dB').textContent=body;$('dYes').textContent=yes;$('dNo').textContent=no;
  const done=v=>{d.close();$('dYes').onclick=$('dNo').onclick=null;r(v)};$('dYes').onclick=()=>done(true);$('dNo').onclick=()=>done(false);d.showModal()})}
const err=e=>e?.code==='permission-denied'?'Keine Berechtigung (oder Aktion gerade nicht erlaubt).':(e?.code||e?.message||'Unbekannter Fehler');
const off=arr=>{arr.forEach(u=>{try{u()}catch(e){}});arr.length=0};
const R=(code,...p)=>D.doc(fs,'rooms',code,...p);
const cname=(room,id)=>room?.cands?.find(c=>c.id===id)?.name||'?';
const baseUrl=()=>location.origin+location.pathname;
async function copy(t){try{await navigator.clipboard.writeText(t);toast('Kopiert')}catch(e){toast('Kopieren nicht möglich')}}

/* ---------- Rendering ---------- */
function render(){
  if(authReady&&prof&&fs)watchTheme(desiredTheme());
  const room=page==='room'?aRoom:page==='vote'&&vCode?vRoom:null;
  $('title').textContent=room?.title||(page==='rooms'?'Wahlen verwalten':page==='staff'?'Wähler':page==='groups'?'Gruppen':page==='themes'?'Designs':page==='archive'?'Archiv':page==='account'?'Mein Konto':appName);
  $('chip').innerHTML=room?`<span class="chip s-${room.status}"><i></i>${LABEL[room.status]}</span>`:'';
  $('who').textContent=prof?`${appName} · ${prof.name} · ${isSup?'Hauptwahlleiter':isAdm?'Wahlleiter':'Wähler'}`:appName;
  const tabs=$('tabs');
  if(me&&prof){
    const T=(p,t)=>`<button data-page="${p}" aria-selected="${page===p||(p==='rooms'&&page==='room')}">${t}</button>`;
    tabs.innerHTML=(isAdm?T('vote','Wählen')+T('rooms','Wahlen verwalten')+T('staff','Wähler')+(isSup?T('groups','Gruppen')+T('themes','Designs'):'')+T('archive','Archiv'):'')+`<button class="ghost out" data-page="${page==='account'?'vote':'account'}" aria-selected="${page==='account'}">Konto</button><button class="ghost" id="logout">Abmelden</button>`;
    tabs.hidden=false;
  }else tabs.hidden=true;
  let h;
  if(!authReady)h=`<div class="sheet"><p class="hint">Wird geladen …</p></div>`;
  else if(!me)h=loginView();
  else if(!prof)h=noAccessView();
  else if(page==='rooms'&&isAdm)h=roomsView();
  else if(page==='room'&&isAdm)h=adminRoomView();
  else if(page==='staff'&&isAdm)h=staffView();
  else if(page==='themes'&&isSup)h=themesView();
  else if(page==='groups'&&isSup)h=groupsView();
  else if(page==='archive'&&isAdm)h=archiveView();
  else if(page==='account')h=accountView();
  else h=vCode?voterRoomView():voterHomeView();
  $('main').innerHTML=h;
  if(isAdm&&(page==='archive'||(page==='room'&&aRes)))ensurePdf().catch(()=>{});
  if(page==='room'&&aCode){drawQR('qr',aCode);if(aRoom?.pubCode)drawQR('qr2',aRoom.pubCode)}
}

function loginView(){return`<div class="sheet"><h2>Anmelden</h2><p class="hint">Melde dich mit deinem Wähler-Konto an.</p><form id="lf"><div style="margin-bottom:12px"><label for="lE">Benutzername oder E-Mail</label><input id="lE" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="z. B. max.mustermann oder max@beispiel.de" required></div><div style="margin-bottom:16px"><label for="lP">Passwort</label><input id="lP" type="password" autocomplete="current-password" required></div><div class="row"><button type="submit" ${busy?'disabled':''}>Anmelden</button><button type="button" class="ghost" id="lForgot">Passwort vergessen?</button></div></form></div>`}
function noAccessView(){return`<div class="sheet"><h2>Kein Zugang</h2><p class="hint">Dein Konto (${esc(me.email)}) ist nicht im Wählerverzeichnis eingetragen. Wende dich an deinen Wahlleiter.</p><button class="ghost" id="logout">Abmelden</button></div>`}

/* ---------- Wähler ---------- */
let recentChecked='';
async function checkRecent(list){ // „Zuletzt besucht“: gelöschte Räume entfernen
  const key=list.join(',');if(key===recentChecked)return;checkRecent.busy=true;
  const keep=[];for(const c of list){try{if((await D.getDoc(R(c))).exists())keep.push(c)}catch(e){if(e.code!=='permission-denied')keep.push(c)}}
  ls.set('wa_rooms',keep);recentChecked=keep.join(',');checkRecent.busy=false;if(keep.length!==list.length)render();
}
function accountView(){
  const nameBox=`<div class="sheet"><h2>Mein Anzeigename</h2><p class="hint">So erscheinst du in Räumen und Teilnehmerlisten${isAdm?' und als Wahlleiter im Protokoll':''}. Dein Benutzername <b>${esc(userOf(prof)||me.email)}</b> bleibt fest und steht im Protokoll immer daneben.</p>
  <form id="pf" class="row"><input id="pName" value="${esc(prof?.name||'')}" maxlength="60" required style="max-width:340px" aria-label="Mein Anzeigename"><button type="submit" ${busy?'disabled':''}>Name speichern</button></form></div>`;
  const cur=realMail(me.email)?me.email:'';
  const mailBox=`<div class="sheet"><h2>E-Mail-Adresse</h2><p class="hint">Für „Passwort vergessen?“. Angemeldet wird weiter mit dem Benutzernamen. ${cur?`Hinterlegt: <b>${esc(cur)}</b>`:'Noch keine E-Mail hinterlegt.'}</p>
  <form id="emf"><div class="grid" style="max-width:780px"><div><label for="emNew">${cur?'Neue':'Deine'} E-Mail-Adresse</label><input id="emNew" type="email" autocomplete="email" required></div><div><label for="emPw">Aktuelles Passwort</label><input id="emPw" type="password" autocomplete="current-password" required></div></div>
  <button type="submit" ${busy?'disabled':''}>Bestätigungslink senden</button><p class="hint" style="margin:10px 0 0">Die Adresse gilt erst, wenn du den Link in der Mail angeklickt hast. Danach meldest du dich einmal neu an.</p></form></div>`;
  const tids=isSup?null:myThemeIds();
  const designBox=(isSup||tids.length>1)?`<div class="sheet"><h2>Mein Design</h2><p class="hint">So sieht die App außerhalb von Wahlräumen für dich aus. In einem Wahlraum gilt immer das Design seiner Gruppe.</p><select id="myT" style="max-width:360px">${themeOpts(prof?.theme||'',tids)}</select></div>`:'';
  return nameBox+designBox+mailBox+`<div class="sheet"><h2>Passwort ändern</h2><p class="hint">Angemeldet als <b>${esc(userOf(prof)||me.email||'')}</b>. Zur Sicherheit brauchst du dein aktuelles Passwort.</p>
  <form id="cpf"><div style="margin-bottom:12px;max-width:380px"><label for="cpOld">Aktuelles Passwort</label><input id="cpOld" type="password" autocomplete="current-password" required></div>
  <div class="grid" style="max-width:780px"><div><label for="cpNew">Neues Passwort (mind. 6 Zeichen)</label><input id="cpNew" type="password" autocomplete="new-password" minlength="6" required></div><div><label for="cpNew2">Neues Passwort wiederholen</label><input id="cpNew2" type="password" autocomplete="new-password" minlength="6" required></div></div>
  <div class="row"><button type="submit" class="red" ${busy?'disabled':''}>Passwort ändern</button>${isAdm?'':`<button type="button" class="ghost" data-page="vote">Zurück</button>`}</div></form></div>`;
}
function voterHomeView(){
  const recent=(ls.get('wa_rooms')||[]).filter(Boolean);
  if(recent.length&&fs&&!checkRecent.busy)checkRecent(recent);

function modeText(s){return s.mode==='ranked'?`Rangfolge: bis zu ${s.max} ${s.max==1?'Platz':'Plätze'} vergeben – Platz 1 zählt am meisten.`:`Du kannst bis zu ${s.max} ${s.max==1?'Option':'Optionen'} wählen.`}

function voterRoomView(){
  const s=vRoom,back=`<div class="row" style="margin-top:4px"><button class="ghost mini" id="vLeave">← Anderer Raum</button><span class="hint" style="margin:0">Raum ${fmtCode(vCode)}</span></div>`;

    return`<div class="sheet ballot"><h2>Nicht wahlberechtigt</h2><p class="hint">${why} Du bleibst als anwesend im Raum und siehst das Ergebnis, sobald es veröffentlicht ist.</p>${s.cands?.length?`<label>Zur Wahl steht</label><ul style="margin:0 0 0 1.2em;padding:0">${s.cands.map(c=>`<li>${esc(c.name)}</li>`).join('')}</ul>`:''}</div>${back}`;
  }
  const selfId='u_'+me.uid;
  const done=!observer&&!!vVote&&!editing,live=!observer&&s.status==='running'&&!done,canChange=s.allowChange===true&&s.status==='running';
  let head='';

  if(s.status==='ended'||s.status==='published')head=`<div class="note">Die Wahl ist beendet. Das Ergebnis wird vom Wahlleiter veröffentlicht.</div>`;
  if(observer&&!['ended','published'].includes(s.status)){
    const why=vMember.elig===false?(vMember.via==='public'?'Du bist über den öffentlichen Code als <b>Beobachter</b> im Raum.':'Der Wahlleiter hat dich in diesem Raum als <b>nicht wahlberechtigt</b> eingetragen.'):'Du stehst selbst zur Wahl und darfst in dieser Wahl <b>nicht mit abstimmen</b>.';
    head=`<div class="note">${why} Dein Stimmzettel hat <b>0 Stimmen</b>. Du siehst, was zur Wahl steht, und das Ergebnis, sobald es veröffentlicht ist.</div>${s.status==='setup'?'<p class="hint">Die Wahl hat noch nicht begonnen.</p>':s.status==='paused'?'<p class="hint">Die Wahl ist gerade pausiert.</p>':''}`;
  }
  if(live)head=`<p class="hint">${editing?'<b>Du änderst deine Stimme.</b> ':''}${modeText(s)} Tippe auf eine Option, um sie ${s.mode==='ranked'?'auf den nächsten Platz zu setzen':'anzukreuzen'}.</p>`;
  if(done){

    return`<div class="sheet ballot"><div class="stamp">Abgegeben</div><h2>Stimmzettel</h2><p class="hint">Deine Stimme ist gezählt. Danke! Das Ergebnis erscheint hier, sobald es veröffentlicht wird.</p>${head}<label>Deine Wahl</label><ul style="margin:0 0 0 1.2em;padding:0">${list}</ul>${s.allowChange?'':'<p class="hint" style="margin-top:12px">Die Stimme ist endgültig abgegeben.</p>'}${acts}</div>${back}`;
  }
  const body=s.cands?.length?`<ul class="cands">${s.cands.map(c=>{
      const i=pick.indexOf(c.id),own=c.id===selfId,on=i>=0&&live,mark=own?'–':on?(s.mode==='ranked'?i+1:'✕'):'',act=live&&!own;
      return`<li class="cand ${on?'sel':''} ${act?'':'off'}" data-c="${esc(c.id)}" ${act?'role="button" tabindex="0"':''} ${own?'style="opacity:.55"':''}><span class="box">${mark}</span><span><div class="cname">${esc(c.name)}${own?' (du selbst)':''}</div>${own?'<div class="cinfo">Dich selbst kannst du nicht wählen.</div>':c.info?`<div class="cinfo">${esc(c.info)}</div>`:''}</span></li>`}).join('')}</ul>`
    :`<p class="hint">Es stehen noch keine Optionen zur Wahl.</p>`;
  const foot=observer&&s.status==='running'?`<p class="hint" style="margin:18px 0 0">0 von 0 Stimmen</p>`:live?`<div class="row" style="margin-top:18px;justify-content:space-between"><span class="hint" style="margin:0">${pick.length} von ${s.max} vergeben</span><div class="row">${editing?`<button class="ghost" id="vCancel">Abbrechen</button>`:pick.length?`<button class="ghost" id="clr">Zurücksetzen</button>`:''}<button class="red" id="cast" ${pick.length&&!busy?'':'disabled'}>${editing?'Änderung speichern':'Stimme abgeben'}</button></div></div>`:'';
  return`<div class="sheet ballot"><h2>Stimmzettel</h2>${head}${body}${foot}</div>${back}`;
}

function resultsView(r){
  const top=r.rows[0]?.points||0,unit=r.mode==='ranked'?'Punkte':'Stimmen';let rank=0,prev=null;
  const rows=r.rows.map((x,i)=>{if(x.points!==prev){rank=i+1;prev=x.points}
    return`<div class="res ${rank===1&&x.points>0?'win':''}"><span class="rk">${rank}.</span><span class="cname">${esc(x.name)}</span><span class="num">${x.points} ${unit}</span><span class="bar"><b style="width:${top?x.points/top*100:0}%"></b></span>${r.mode==='ranked'?`<span class="cinfo" style="grid-column:2/4">${x.first}× auf Platz 1 · auf ${x.votes} Stimmzetteln</span>`:''}</div>`}).join('');
  return`<div class="sheet ballot"><h2>Ergebnis</h2><p class="hint">${r.ballots} gültige Stimmzettel · ${r.mode==='ranked'?`Rangfolge (Platz 1 = ${r.max} Punkte, jeder weitere Platz 1 weniger)`:`bis zu ${r.max} Stimme${r.max==1?'':'n'} pro Person`}</p>${rows||'<p class="hint">Keine Optionen.</p>'}</div>`;
}

const voterIds=()=>new Set(aVotes.map(v=>v._id));
const candUidsOf=s=>(s?.cands||[]).filter(c=>c.uid).map(c=>c.uid);
// darf diese Person (Mitglied im Raum) in diesem Raum abstimmen?
const mayVote=(s,m,uid)=>!!m&&m.ok&&m.elig!==false&&!(s?.kind==='person'&&s?.candRule==='none'&&candUidsOf(s).includes(uid));
const aprG=s=>s?.approvalGroup===true||(s?.approvalGroup===undefined&&s?.approval===true);
function participants(){const ids=voterIds();return aMembers.filter(m=>ids.has(m._id)).map(m=>m.name||'?').sort((a,b)=>a.localeCompare(b,'de'))}
function tally(){
  const s=aRoom,ids=new Set(s.cands.map(c=>c.id)),t={};
  s.cands.forEach(c=>t[c.id]={id:c.id,name:c.name,votes:0,points:0,first:0});
  let n=0;
  const mem=Object.fromEntries(aMembers.map(m=>[m._id,m]));
  aVotes.filter(v=>Array.isArray(v.choices)).forEach(v=>{
    if(mem[v._id]&&!mayVote(s,mem[v._id],v._id))return; // nicht (mehr) wahlberechtigt
    const ch=[...new Set(v.choices)].filter(x=>ids.has(x)&&x!=='u_'+v._id).slice(0,s.max);if(!ch.length)return;n++;
    ch.forEach((id,i)=>{t[id].votes++;t[id].points+=s.mode==='ranked'?s.max-i:1;if(i===0)t[id].first++});
  });
  const rows=Object.values(t).sort((a,b)=>b.points-a.points||b.first-a.first||a.name.localeCompare(b.name));
  return{roomId:aCode,title:s.title,owner:s.owner,ownerName:ownerNameOf(s.owner,s.ownerName||''),mode:s.mode,max:s.max,allowChange:s.allowChange===true,kind:s.kind||'option',candRule:s.candRule||'noself',approvalGroup:aprG(s),approvalPublic:s.approvalPublic===true,pub:!!s.pubCode,groupName:grpOf(s.group)?.name||'',
    present:aMembers.filter(m=>m.ok).length,times:{...(s.times||{}),published:Date.now()},ballots:n,rows,publishedAt:Date.now()};
}

function attendees(){
  const ids=voterIds(),own=aRoom?.owner;
  const uOf=id=>id===me?.uid?userOf(prof):userOf(staff.find(u=>u._id===id));
  const cu=candUidsOf(aRoom);
  const l=aMembers.filter(m=>m.ok).map(m=>({name:m.name||'?',user:m.user||uOf(m._id)||'',voted:ids.has(m._id)&&mayVote(aRoom,m,m._id),lead:m._id===own,ext:m.via==='public',cand:cu.includes(m._id),elig:mayVote(aRoom,m,m._id)}));
  if(!l.some(a=>a.lead))l.push({name:ownerNameOf(own,aRoom?.ownerName||''),user:uOf(own)||'',voted:false,lead:true,onlyLead:true});
  return l.sort((a,b)=>(b.lead-a.lead)||a.name.localeCompare(b.name,'de'));
}

  </div>`;

  const leaderIds=[...new Set([...(s.leaders||[]),...(isSup?[me.uid]:[])])];
  const opts=leaderIds.map(id=>`<option value="${esc(id)}" ${id===s.owner?'selected':''}>${esc(id===me.uid?prof.name+' (ich)':nameOf(id))}</option>`).join('');
  const takeover=`<div class="sheet"${s.owner!==me.uid?' style="border-left:6px solid var(--red)"':''}><h2>Verantwortlicher Wahlleiter</h2>
    <p class="hint">${s.owner===me.uid?'Du bist für diesen Raum verantwortlich und stehst so im Protokoll.':`Verantwortlich ist <b>${esc(s.ownerName||nameOf(s.owner))}</b>. Als ${isSup?'Hauptwahlleiter':'Wahlleiter der Gruppe'} kannst du den Raum trotzdem vollständig steuern – oder die Verantwortung übernehmen.`} Alle Wahlleiter der Gruppe können den Raum leiten.</p>
    <div class="row">${s.owner!==me.uid?`<button class="red" id="oMe" ${busy?'disabled':''}>Verantwortung übernehmen</button>`:''}${isSup&&leaderIds.length>1?`<select id="oSel" style="width:auto">${opts}</select><button class="ghost" id="oSet" ${busy?'disabled':''}>Übergeben</button>`:''}</div></div>`;
  return codeBox+takeover+res+control+entry+cfg+danger;
}

let qrLib=null;
function drawQR(elId,code){
  const el=$(elId);if(!el)return;
  const go=()=>{try{el.innerHTML='';new window.QRCode(el,{text:`${baseUrl()}?r=${code}`,width:140,height:140,correctLevel:window.QRCode.CorrectLevel.M})}catch(e){el.remove()}};
  if(window.QRCode)return go();

  qrLib.then(()=>{if($(elId))go()}).catch(()=>$(elId)?.remove());

/* ---------- Protokoll ---------- */
function protoStats(r){
  let list;
  if(r.attendees)list=r.attendees;
  else list=[...(r.participants||[]).map(n=>({name:n,voted:true})),...(r.abstained||[]).map(n=>({name:n,voted:false}))].sort((a,b)=>a.name.localeCompare(b.name,'de'));
  // anwesend: alle (auch ein nur leitender Wahlleiter); wahlberechtigt: allein nach dem Haken „wahlberechtigt“
  const present=list.length?list.length:(r.present??null);
  const eligible=list.filter(a=>!a.onlyLead&&a.elig!==false);
  const elig=list.length?eligible.length:(r.present??null);
  return{list,present,elig,abst:eligible.filter(a=>!a.voted).length,known:list.length>0,turnout:elig?Math.round(r.ballots/elig*100):null};
}
const roleOf=a=>a.onlyLead?'Wahlleiter':[(a.lead?'Wahlleiter':''),(a.ext?'Gast (öffentl. Code)':'Wähler'),(a.cand?'steht zur Wahl':''),(a.elig===false?'nicht wahlberechtigt':'')].filter(Boolean).join(', ');
const kindText=r=>r.kind==='person'?`Personenwahl${r.candRule==='none'?' (Kandidaten wählen nicht mit)':' (Kandidaten dürfen sich nicht selbst wählen)'}`:'Sachwahl (Optionen)';
function stimmText(r){
  if(r.groupName===undefined)return`Angemeldete Wähler mit Raum-Code${r.approval?', Beitritt durch den Wahlleiter bestätigt':''}`;
  let t=`Mitglieder der Gruppe ${r.groupName||'–'} mit Gruppen-Code${r.approvalGroup?' (Beitritt bestätigt)':''}`;
  if(r.pub)t+=`; Gäste mit öffentlichem Code${r.approvalPublic?' (Beitritt bestätigt)':''} als Beobachter, wahlberechtigt nur nach Freigabe durch den Wahlleiter`;
  return t;
}
function protoHTML(r){
  const unit=r.mode==='ranked'?'Punkte':'Stimmen',T=r.times||{};let rank=0,prev=null;
  const rows=r.rows.map((x,i)=>{if(x.points!==prev){rank=i+1;prev=x.points}return`<tr><td class="n">${rank}.</td><td>${esc(x.name)}</td><td class="n">${x.points}</td>${r.mode==='ranked'?`<td class="n">${x.first}</td><td class="n">${x.votes}</td>`:''}</tr>`}).join('');
  const P=protoStats(r);
  return`<h1>Wahlprotokoll</h1><div>${esc(r.title||'Wahl')} · Raum ${fmtCode(r.roomId)}</div>
  <h2>Angaben zur Wahl</h2><table class="meta">
  <tr><td>Wahlleiter</td><td>${esc(r.ownerName||'–')}</td></tr>
  <tr><td>Wahlart</td><td>${r.mode==='ranked'?`Rangfolge, bis zu ${r.max} Plätze (Platz 1 = ${r.max} Punkte, jeder weitere Platz 1 Punkt weniger)`:`Allgemein, bis zu ${r.max} Stimme${r.max==1?'':'n'} pro Person`}</td></tr>
  <tr><td>Stimmberechtigung</td><td>${esc(stimmText(r))}</td></tr>
  <tr><td>Ändern/Zurückziehen</td><td>${r.allowChange?'erlaubt während der Wahl':'nicht erlaubt'}</td></tr>
  <tr><td>Wahl gestartet</td><td>${fmt(T.running)}</td></tr>
  <tr><td>Wahl beendet</td><td>${fmt(T.ended)}</td></tr>
  <tr><td>Ergebnis veröffentlicht</td><td>${fmt(T.published||r.publishedAt)}</td></tr>
  <tr><td>Art der Wahl</td><td>${kindText(r)}</td></tr>
  <tr><td>Im Raum anwesend</td><td>${P.present??'–'} (inkl. Wahlleiter)</td></tr>
  <tr><td>Davon wahlberechtigt</td><td>${P.elig??'–'}</td></tr>
  <tr><td>Abgegebene Stimmen</td><td>${r.ballots}${P.turnout!=null?` (Beteiligung ${P.turnout} % der Wahlberechtigten)`:''}</td></tr>
  <tr><td>Enthaltungen</td><td>${P.known?P.abst:'–'}</td></tr>
  </table>
  <h2>Ergebnis</h2><table><tr><th>Platz</th><th>Option</th><th>${unit}</th>${r.mode==='ranked'?'<th>× Platz 1</th><th>auf Stimmzetteln</th>':''}</tr>${rows}</table>
  ${P.list.length?`<h2>Teilnehmerliste (${P.list.length})</h2><table><tr><th>Nr.</th><th>Anzeigename</th><th>Benutzername</th><th>Rolle</th><th style="text-align:center">Abgestimmt</th></tr>${P.list.map((a,i)=>`<tr><td class="n">${i+1}</td><td>${esc(a.name)}</td><td>${esc(a.user||'–')}</td><td>${roleOf(a)}</td><td style="text-align:center;font-size:13pt">${a.onlyLead||a.elig===false?'–':a.voted?'☒':'☐'}</td></tr>`).join('')}</table>`:''}
  <p style="font-size:9pt;color:#555">Das Protokoll enthält keine Angaben darüber, wer was gewählt hat.</p>
  <div class="sig"><div>Ort, Datum</div><div>Unterschrift Wahlleiter</div></div>
  <p style="font-size:9pt;color:#555;margin-top:18pt">Erstellt am ${fmt(Date.now())}</p>`;
}
/* ---------- PDF (direkt erzeugt) ---------- */
/* PDF_CORE_START */
const pdfTxt=s=>String(s??'').replace(/[–—]/g,'-').replace(/[“”„]/g,'"').replace(/[‘’‚]/g,"'").replace(/…/g,'...').replace(/✓/g,'x').replace(/[^\x00-\xff]/g,'?');
function pdfName(r){
  const slug=String(r.title||'Wahl').replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/Ä/g,'Ae').replace(/Ö/g,'Oe').replace(/Ü/g,'Ue').replace(/ß/g,'ss').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,'').slice(0,40)||'Wahl';
  const d=new Date(r.times?.published||r.publishedAt||Date.now()),day=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  return`Wahlprotokoll_${slug}_${fmtCode(r.roomId)}_${day}.pdf`;
}
function makePdf(r,J){
  const doc=new J({unit:'mm',format:'a4'}),M=16,W=210-2*M,T=pdfTxt,TT=r.times||{},P=protoStats(r);
  const tbl=(o)=>{doc.autoTable({theme:'grid',margin:{left:M,right:M,bottom:20},styles:{font:'helvetica',fontSize:10,cellPadding:1.8,lineColor:[150,150,150],lineWidth:.2,textColor:20,overflow:'linebreak'},headStyles:{fillColor:[235,235,235],textColor:20,fontStyle:'bold'},...o});return doc.lastAutoTable.finalY};
  const h2=(t,y)=>{if(y>262){doc.addPage();y=M}doc.setFont('helvetica','bold');doc.setFontSize(13);doc.text(T(t),M,y+8);return y+11};
  doc.setFont('helvetica','bold');doc.setFontSize(20);doc.text('Wahlprotokoll',M,M+6);
  doc.setFont('helvetica','normal');doc.setFontSize(11);doc.text(T(`${r.title||'Wahl'} · Raum ${fmtCode(r.roomId)}`),M,M+13);
  let y=h2('Angaben zur Wahl',M+16);
  const meta=[['Wahlleiter',r.ownerName||'-'],
    ['Wahlart',r.mode==='ranked'?`Rangfolge, bis zu ${r.max} Plätze (Platz 1 = ${r.max} Punkte, jeder weitere Platz 1 Punkt weniger)`:`Allgemein, bis zu ${r.max} Stimme${r.max==1?'':'n'} pro Person`],
    ['Stimmberechtigung',stimmText(r)],
    ['Ändern/Zurückziehen',r.allowChange?'erlaubt während der Wahl':'nicht erlaubt'],
    ['Wahl gestartet',fmt(TT.running)],['Wahl beendet',fmt(TT.ended)],['Ergebnis veröffentlicht',fmt(TT.published||r.publishedAt)],
    ['Art der Wahl',kindText(r)],['Im Raum anwesend',`${P.present??'-'} (inkl. Wahlleiter)`],['Davon wahlberechtigt',String(P.elig??'-')],['Abgegebene Stimmen',`${r.ballots}${P.turnout!=null?` (Beteiligung ${P.turnout} % der Wahlberechtigten)`:''}`],['Enthaltungen',P.known?String(P.abst):'-']].map(a=>a.map(T));
  y=tbl({startY:y,body:meta,columnStyles:{0:{cellWidth:58,fontStyle:'bold'}}});
  y=h2('Ergebnis',y+2);
  let rank=0,prev=null;const ranked=r.mode==='ranked';
  const body=r.rows.map((x,i)=>{if(x.points!==prev){rank=i+1;prev=x.points}return[rank+'.',T(x.name),String(x.points),...(ranked?[String(x.first),String(x.votes)]:[])]});
  y=tbl({startY:y,head:[['Platz','Option',ranked?'Punkte':'Stimmen',...(ranked?['× Platz 1','auf Stimmzetteln']:[])]],body,columnStyles:{0:{cellWidth:16,halign:'right'},2:{halign:'right',cellWidth:24},3:{halign:'right',cellWidth:24},4:{halign:'right',cellWidth:32}}});
  if(P.list.length){y=h2(`Teilnehmerliste (${P.list.length})`,y+2);
    y=tbl({startY:y,head:[['Nr.','Anzeigename','Benutzername','Rolle','Abgestimmt']],body:P.list.map((a,i)=>[String(i+1),T(a.name),T(a.user||'-'),roleOf(a),'']),
      columnStyles:{0:{cellWidth:12,halign:'right'},2:{cellWidth:42},3:{cellWidth:34},4:{cellWidth:24,halign:'center'}},
      didDrawCell:c=>{if(c.section!=='body'||c.column.index!==4)return;const a=P.list[c.row.index],s=4,x=c.cell.x+c.cell.width/2-s/2,yy=c.cell.y+c.cell.height/2-s/2;
        if(a.onlyLead||a.elig===false){doc.setDrawColor(90);doc.setLineWidth(.4);doc.line(x+.5,yy+s/2,x+s-.5,yy+s/2);return}
        doc.setDrawColor(40);doc.setLineWidth(.3);doc.rect(x,yy,s,s);
        if(a.voted){doc.setLineWidth(.5);doc.line(x+.8,yy+2.1,x+1.7,yy+3.1);doc.line(x+1.7,yy+3.1,x+3.3,yy+.9)}}})}
  doc.setFont('helvetica','italic');doc.setFontSize(8.5);doc.text(T('Das Protokoll enthält keine Angaben darüber, wer was gewählt hat.'),M,y+5);y+=6;
  if(y>250){doc.addPage();y=M}
  y+=22;doc.setDrawColor(0);doc.setLineWidth(.3);doc.line(M,y,M+W/2-8,y);doc.line(M+W/2+8,y,M+W,y);
  doc.setFont('helvetica','normal');doc.setFontSize(9);doc.text('Ort, Datum',M,y+4);doc.text('Unterschrift Wahlleiter',M+W/2+8,y+4);
  const n=doc.getNumberOfPages(),made=T(`Erstellt am ${fmt(Date.now())}`);
  for(let i=1;i<=n;i++){doc.setPage(i);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(110);doc.text(made,M,287);doc.text(`Seite ${i} von ${n}`,210-M,287,{align:'right'});doc.setTextColor(0)}
  return doc;
}
/* PDF_CORE_END */
const PDF_JS=['https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js','https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js'];
let pdfLib=null;
const loadScript=src=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)});
const pdfReady=()=>!!(window.jspdf?.jsPDF?.API?.autoTable);
function ensurePdf(){if(pdfReady())return Promise.resolve();if(!pdfLib)pdfLib=loadScript(PDF_JS[0]).then(()=>loadScript(PDF_JS[1])).catch(e=>{pdfLib=null;throw e});return pdfLib}
async function exportPdf(r){
  let doc;
  try{if(!pdfReady()){toast('PDF wird vorbereitet …');await ensurePdf()}doc=makePdf(r,window.jspdf.jsPDF)}
  catch(e){toast('PDF-Erstellung nicht möglich – Druckansicht wird geöffnet');printProto(r);return}
  const name=pdfName(r),blob=doc.output('blob');
  let file=null;try{file=new File([blob],name,{type:'application/pdf'})}catch(e){}
  const mobile=matchMedia('(pointer:coarse)').matches;
  if(mobile&&file&&navigator.canShare?.({files:[file]})){
    const share=()=>navigator.share({files:[file],title:name});
    try{await share();return}catch(e){
      if(e.name==='AbortError')return;
      // Teilen braucht einen frischen Tipp, wenn das Vorbereiten zu lange gedauert hat
      if(await ask('PDF ist fertig','Tippe auf „Teilen“, um es in Dateien zu sichern, zu senden oder zu drucken.','Teilen')){try{await share();return}catch(x){if(x.name==='AbortError')return}}
    }
  }
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);toast('PDF gespeichert: '+name);
}
function printProto(r){$('proto').innerHTML=protoHTML(r);setTimeout(()=>{try{window.print()}catch(e){toast('Drucken nicht möglich')}},50)}

  gUnsub.push(D.onSnapshot(D.collection(fs,'themes'),q=>{themes=q.docs.map(d=>({...d.data(),_id:d.id})).sort((a,b)=>a.name.localeCompare(b.name,'de'));render()},()=>{}));

  }else{staff=[];myRooms=[];archive=[]}

async function joinRoom(code){
  code=norm(code);if(code.length<4){toast('Bitte den Raum-Code eingeben');return}
  busy=true;render();
  try{
    let roomId=null,via='group',room=null,pubApproval=false;
    try{const r=await D.getDoc(R(code));if(r.exists()){roomId=code;room=r.data()}}catch(e){}
    if(!roomId){try{const p=await D.getDoc(D.doc(fs,'pubcodes',code));if(p.exists()){roomId=p.data().room;via='public';pubApproval=p.data().approval===true}}catch(e){}}
    if(!roomId){ls.set('wa_rooms',(ls.get('wa_rooms')||[]).filter(c=>c!==code));toast('Raum nicht gefunden – Code prüfen. Gehörst du nicht zur Gruppe, brauchst du den öffentlichen Code.');busy=false;render();return}
    const m=await D.getDoc(R(roomId,'members',me.uid));
    if(!m.exists()){
      if(room&&(!room.entryOpen||['ended','published'].includes(room.status))){toast('Der Einlass in diesen Raum ist geschlossen');busy=false;render();return}
      if(via==='group'&&room?.group&&!myGroupIds().includes(room.group)){toast('Du gehörst nicht zur Gruppe dieses Raums – frag den Wahlleiter nach dem öffentlichen Code.');busy=false;render();return}
      const doc={name:prof.name,user:userOf(prof),at:Date.now(),via,ok:via==='public'?!pubApproval:!aprG(room)};
      if(via==='public'){doc.code=code;doc.elig=false} // Externe: zunächst nur Beobachter
      try{await D.setDoc(R(roomId,'members',me.uid),doc)}
      catch(e){toast(e.code==='permission-denied'?'Beitritt nicht möglich – der Einlass ist geschlossen oder der Code gilt nicht mehr.':err(e));busy=false;render();return}
    }
    const rec=[roomId,...(ls.get('wa_rooms')||[]).filter(c=>c!==roomId)].slice(0,5);ls.set('wa_rooms',rec);
    vJoinCode=code;openVoterRoom(roomId);
  }catch(e){toast(err(e))}
  busy=false;render();
}
function openVoterRoom(code){
  off(vUnsub);vCode=code;vRoom=null;vMember=null;vVote=null;vRes=null;vLoaded=false;vJoined=false;pick=[];editing=false;page='vote';render();
  vUnsub.push(D.onSnapshot(R(code),s=>{vRoom=s.exists()?s.data():null;vLoaded=true;
    if(!vRoom||vRoom.status!=='running'){pick=[];editing=false}
    vRes=vRoom?.status==='published'?vRoom.results||null:null;render()},()=>{vLoaded=true;vRoom=null;render()}));

  vUnsub.push(D.onSnapshot(R(code,'votes',me.uid),s=>{vVote=s.exists()?s.data():null;render()},()=>{}));

/* ---------- Aktionen ---------- */
function withTimes(cur,patch){
  if(!patch.status||patch.status===cur.status)return patch;
  const t={...(cur.times||{})};
  if(patch.status==='running'){if(!t.running)t.running=Date.now();else t.resumed=Date.now()}else t[patch.status]=Date.now();
  return{...patch,times:t};
}
async function saveRoom(patch){
  if(busy)return;busy=true;render();
  try{await D.updateDoc(R(aCode),{...withTimes(aRoom,patch),updated:Date.now()})}catch(e){toast('Speichern fehlgeschlagen: '+err(e))}
  busy=false;render();
}
async function freeCode(){let c,t=0;do{c=rnd(6);t++}while(t<6&&(await D.getDoc(R(c)).then(s=>s.exists()).catch(()=>true)||await D.getDoc(D.doc(fs,'pubcodes',c)).then(s=>s.exists()).catch(()=>false)));return c}

    busy=false;openAdminRoom(code);toast('Wahlraum eröffnet');
  }catch(e){busy=false;toast(err(e));render()}
}
async function deleteRoom(){
  if(!await ask('Raum endgültig löschen?','Alle Stimmen, Teilnehmenden und das Ergebnis werden gelöscht. Archivierte Protokolle bleiben erhalten.','Löschen'))return;
  busy=true;render();const code=aCode;
  try{
    const refs=[...aVotes.map(v=>R(code,'votes',v._id)),...aMembers.map(m=>R(code,'members',m._id)),R(code,'results','final')];
    for(let i=0;i<refs.length;i+=100){const b=D.writeBatch(fs);refs.slice(i,i+100).forEach(r=>b.delete(r));await b.commit()}
    if(aRoom?.pubCode){try{await D.deleteDoc(D.doc(fs,'pubcodes',aRoom.pubCode))}catch(e){}}
    await D.deleteDoc(R(code));busy=false;closeAdminRoom();toast('Raum gelöscht');
  }catch(e){busy=false;toast(err(e));render()}
}
async function castVote(){
  const s=vRoom;
  const list=pick.map((id,i)=>(s.mode==='ranked'?(i+1)+'. ':'')+cname(s,id)).join(', ');
  const fin=s.allowChange?'Solange die Wahl läuft, kannst du sie noch ändern oder zurückziehen.':'Danach kannst du sie nicht mehr ändern.';
  if(!await ask(editing?'Änderung speichern?':'Stimme abgeben?',`Deine Wahl: ${list}. ${fin}`,editing?'Speichern':'Abgeben'))return;
  busy=true;render();
  try{await D.setDoc(R(vCode,'votes',me.uid),{choices:[...pick],at:Date.now()});toast(editing?'Stimme geändert':'Stimme abgegeben');editing=false;pick=[]}
  catch(e){toast(e.code==='permission-denied'?'Abgabe nicht möglich – schon gewählt, oder die Wahl läuft gerade nicht.':err(e))}
  busy=false;render();
}
async function withdraw(){
  if(!await ask('Stimme zurückziehen?','Deine Stimme wird gelöscht und nicht gezählt. Du kannst danach neu wählen, solange die Wahl läuft.','Zurückziehen'))return;

  try{await D.deleteDoc(R(vCode,'votes',me.uid));pick=[];toast('Stimme zurückgezogen')}catch(e){toast(err(e))}
  busy=false;render();
}
async function createAccount(name,raw,mail,pw,grps){ // true = angelegt/eingeladen
  const username=String(raw||'').trim().toLowerCase(),email=String(mail||'').trim().toLowerCase();name=String(name||'').trim();
  if(!/^[a-z0-9][a-z0-9._-]{2,39}$/.test(username)){toast('Benutzername: 3–40 Zeichen, nur a–z, 0–9, Punkt, Strich, Unterstrich');return false}
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){toast('Bitte eine E-Mail im Format name@domain.de eintragen (zum Testen geht auch eine Fantasie-Adresse)');return false}
  if(!name||pw.length<6){toast('Bitte alles ausfüllen (Passwort mind. 6 Zeichen)');return false}
  // gibt es das Konto schon? → statt neu anlegen in die Gruppe einladen
  const ex=staff.find(u=>userOf(u)===username||String(u.email||'').toLowerCase()===email);
  if(!ex){try{const l=await D.getDoc(D.doc(fs,'logins',username));if(l.exists()){toast(`Der Benutzername „${username}“ ist schon vergeben. Bitte einen anderen wählen.`);return false}}catch(e){}}
  if(ex){
    const missing=grps.filter(g=>!(ex.groups||[]).includes(g));
    const what=userOf(ex)===username?`Der Benutzername „${username}“`:`Die E-Mail ${email}`;
    if(!missing.length){toast(`${what} gehört schon zu ${ex.name}${grps.length?', der bereits in der Gruppe ist':''}. Bitte andere Angaben verwenden.`);return false}
    const gn=missing.map(g=>grpOf(g)?.name||'?').join(', ');
    if(await ask('Konto gibt es schon',`${what} gehört bereits zu ${ex.name} (${userOf(ex)}). Möchtest du dieses bestehende Konto in ${gn} einladen – oder lieber ein anderes Konto mit anderen Angaben anlegen?`,'Bestehendes Konto einladen','Andere Angaben verwenden')){
      for(const g of missing)await setMembership(ex._id,g,true);toast(`${ex.name} in ${gn} eingeladen`);return true}
    toast('Bitte andere Angaben eintragen');return false;
  }
  if(!secAuth)secAuth=A.getAuth(F.initializeApp(firebaseConfig,'verwaltung'));
  let uid=null,revived=false;
  try{const c=await A.createUserWithEmailAndPassword(secAuth,email,pw);uid=c.user.uid;await A.signOut(secAuth)}
  catch(e){
    if(e.code!=='auth/email-already-in-use'){toast(e.code==='auth/invalid-email'?'Ungültiger Benutzername bzw. E-Mail':e.code==='auth/weak-password'?'Passwort zu schwach (mind. 6 Zeichen)':err(e));return false}
    const acc=await D.getDoc(D.doc(fs,'accounts',email)).catch(()=>null);
    if(!acc?.exists()){toast('Zu dieser E-Mail gibt es noch ein altes Login-Konto, das die App nicht kennt. Der Hauptwahlleiter muss es einmalig in Firebase → Authentication löschen.');return false}
    uid=acc.data().uid;
    if(staff.some(u=>u._id===uid)){toast('Dieses Konto gibt es schon – nimm es mit „Vorhandenes Konto aufnehmen“ in die Gruppe auf.');return false}
    revived=true;
  }
  await D.setDoc(D.doc(fs,'users',uid),{name,username,email,groups:grps,leads:[],theme:null,created:Date.now()});
  try{await D.setDoc(D.doc(fs,'accounts',email),{uid,email})}catch(e){}
  try{await D.setDoc(D.doc(fs,'logins',username),{uid,email})}catch(e){}
  toast(revived?`${name} wieder aufgenommen – es gilt das bisherige Passwort dieses Kontos`:`${name} angelegt`);return true;
}
async function createStaff(f){
  const el=f.elements,grps=[...f.querySelectorAll('input[name=sG]:checked')].map(x=>x.value);
  busy=true;render();try{if(await createAccount(el.sN.value,el.sE.value,el.sM.value,el.sP.value,grps))f.reset()}catch(e){toast(err(e))}busy=false;render();

async function setLeader(gid,uid,on){ // nur Hauptwahlleiter: Gruppe, Konto und Räume der Gruppe gleichziehen
  const g=grpOf(gid);if(!g)return;const set=new Set(g.leaders||[]);on?set.add(uid):set.delete(uid);const L=[...set];
  await D.updateDoc(D.doc(fs,'groups',gid),{leaders:L});
  const u=staff.find(x=>x._id===uid);if(u){const ls=new Set(u.leads||[]);on?ls.add(gid):ls.delete(gid);await D.updateDoc(D.doc(fs,'users',uid),{leads:[...ls]})}
  const rs=myRooms.filter(r=>r.group===gid);for(let i=0;i<rs.length;i+=100){const b=D.writeBatch(fs);rs.slice(i,i+100).forEach(r=>b.update(R(r._id),{leaders:L}));await b.commit()}
}
async function setMembership(uid,gid,on){
  const u=staff.find(x=>x._id===uid);if(!u)return false;const set=new Set(u.groups||[]);on?set.add(gid):set.delete(gid);
  await D.updateDoc(D.doc(fs,'users',uid),{groups:[...set]});return true;
}
const mapped=new Set();
async function syncLeads(){ // Hauptwahlleiter: user.leads = Gruppen, in denen die Person Wahlleiter ist
  if(!isSup||!groups.length&&!staff.some(u=>(u.leads||[]).length))return;
  for(const u of staff){const want=groups.filter(g=>(g.leaders||[]).includes(u._id)).map(g=>g._id).sort(),have=[...(u.leads||[])].sort();
    if(JSON.stringify(want)!==JSON.stringify(have)){try{await D.updateDoc(D.doc(fs,'users',u._id),{leads:want})}catch(e){}}}
}
async function backfillAccounts(){ // merkt sich E-Mail→Konto, damit entfernte Personen später wieder aufgenommen werden können
  const todo=staff.filter(u=>u.email&&!mapped.has(u._id));todo.forEach(u=>mapped.add(u._id));
  for(const u of todo){try{await D.setDoc(D.doc(fs,'accounts',String(u.email).toLowerCase()),{uid:u._id,email:String(u.email).toLowerCase()})}catch(e){}
    if(isSup&&!u.username){try{await D.updateDoc(D.doc(fs,'users',u._id),{username:userOf(u)})}catch(e){}}
    const un=userOf(u);if(un&&!un.includes('@')){try{const l=await D.getDoc(D.doc(fs,'logins',un));if(!l.exists())await D.setDoc(D.doc(fs,'logins',un),{uid:u._id,email:String(u.email).toLowerCase()})}catch(e){}}}
}
const readDraft=()=>{if(!tDraft)return;const v=id=>$(id)?.value;tDraft={...tDraft,name:v('tN')??tDraft.name,app:v('tA')??tDraft.app,pri:v('tP')??tDraft.pri,acc:v('tC')??tDraft.acc,bg:v('tB')??tDraft.bg}};
async function saveTheme(){
  readDraft();const d=tDraft,name=d.name.trim(),app=d.app.trim();
  if(!name||!app){toast('Bitte Name und App-Name eintragen');return}
  if(![d.pri,d.acc,d.bg].every(x=>HEX.test(x))){toast('Ungültige Farbe');return}
  busy=true;render();
  try{const id=d._id||'t'+rnd(9),data={name:name.slice(0,40),app:app.slice(0,40),pri:d.pri,acc:d.acc,bg:d.bg,owner:d.owner||me.uid,updated:Date.now()};
    await D.setDoc(D.doc(fs,'themes',id),data);tDraft=null;toast('Design gespeichert')}catch(e){toast(err(e))}
  busy=false;applyTheme(curTheme);render();
}

/* ---------- Ereignisse ---------- */
document.addEventListener('click',async e=>{
  const t=e.target.closest('button,[data-c]');if(!t)return;
  const ds=t.dataset;
  if(ds.page){page=ds.page;if(tDraft){tDraft=null;applyTheme(curTheme)}if(page!=='room')off(aUnsub),aCode=null;render();return}
  if(ds.c){if(t.classList.contains('off'))return;const s=vRoom,id=ds.c,i=pick.indexOf(id);
    if(i>=0)pick.splice(i,1);else if(pick.length<s.max)pick.push(id);else if(s.max===1)pick=[id];else toast(`Höchstens ${s.max} möglich`);render();return}
  if(ds.join){joinRoom(ds.join);return}
  if(ds.open){openAdminRoom(ds.open);return}
  if(ds.mode){draft.mode=ds.mode;render();return}
  if(ds.kind){if(draft.kind!==ds.kind){draft.kind=ds.kind;draft.cands=[]}render();return}
  if(ds.crule){draft.candRule=ds.crule;render();return}
  if(ds.del){draft.cands.splice(+ds.del,1);render();return}
  if(ds.ok){try{await D.updateDoc(R(aCode,'members',ds.ok),{ok:true})}catch(x){toast(err(x))}return}
  if(ds.kick){if(await ask('Beitritt ablehnen?','Die Person wird aus dem Raum entfernt.','Ablehnen'))try{await D.deleteDoc(R(aCode,'members',ds.kick))}catch(x){toast(err(x))}return}
  if(ds.ap){const a=archive.find(x=>x._id===ds.ap);if(a)exportPdf(a);return}
  if(ds.ad){if(await ask('Protokoll löschen?','Das Protokoll wird endgültig aus dem Archiv entfernt.','Löschen'))try{await D.deleteDoc(D.doc(fs,'archive',ds.ad));toast('Gelöscht')}catch(x){toast(err(x))}return}
  if(ds.cc){copy(fmtCode(ds.cc));return}
  if(ds.cl){copy(`${baseUrl()}?r=${ds.cl}`);return}
  if(ds.gdel){const g=grpOf(ds.gdel);if(g&&await ask(`Gruppe „${g.name}“ löschen?`,'Mitglieder verlieren die Zugehörigkeit. Bestehende Wahlräume dieser Gruppe bleiben, verlieren aber ihr Design.','Löschen')){busy=true;render();
    try{const ms=staff.filter(u=>(u.groups||[]).includes(g._id));for(let i=0;i<ms.length;i+=100){const b=D.writeBatch(fs);ms.slice(i,i+100).forEach(u=>b.update(D.doc(fs,'users',u._id),{groups:(u.groups||[]).filter(x=>x!==g._id)}));await b.commit()}
      await D.deleteDoc(D.doc(fs,'groups',g._id));toast('Gruppe gelöscht')}catch(x){toast(err(x))}busy=false;render()}return}
  if(ds.preset){const p=PRESETS.find(x=>x.key===ds.preset);tDraft={name:p.key==='standard'?'Mein Design':p.name,app:p.app,pri:p.pri,acc:p.acc,bg:p.bg};applyTheme(tDraft);render();return}
  if(ds.tedit){const t=themes.find(x=>x._id===ds.tedit);if(t){tDraft={...t};applyTheme(t);render()}return}
  if(ds.tdel){const t=themes.find(x=>x._id===ds.tdel);if(t&&await ask(`Design „${t.name}“ löschen?`,'Wer dieses Design hat, sieht danach wieder das Standard-Design.','Löschen'))try{await D.deleteDoc(D.doc(fs,'themes',t._id));toast('Gelöscht')}catch(x){toast(err(x))}return}
  if(ds.gout){const [gid,uid]=ds.gout.split('|'),u=staff.find(x=>x._id===uid),g=grpOf(gid);
    if(u&&g&&await ask(`${u.name} aus „${g.name}“ nehmen?`,'Das Konto bleibt bestehen, gehört aber nicht mehr zu dieser Gruppe.','Herausnehmen'))try{await setMembership(uid,gid,false);toast('Aus der Gruppe genommen')}catch(x){toast(err(x))}return}
  if(ds.pw!==undefined){if(!ds.pw)return toast('Keine E-Mail hinterlegt');try{await A.sendPasswordResetEmail(auth,ds.pw);toast('Mail zum Zurücksetzen verschickt')}catch(x){toast(err(x))}return}
  if(ds.rm){const u=staff.find(x=>x._id===ds.rm);if(u&&await ask(`${u.name} entfernen?`,'Die Person kann sich danach nicht mehr an Wahlen beteiligen. Du kannst sie später mit derselben E-Mail wieder aufnehmen – dann gilt ihr bisheriges Passwort.','Entfernen'))try{await D.deleteDoc(D.doc(fs,'users',u._id))}catch(x){toast(err(x))}return}
  const s=aRoom;
  switch(t.id){
    case 'logout':off(vUnsub);off(aUnsub);off(gUnsub);vCode=null;aCode=null;page='vote';tDraft=null;await A.signOut(auth);break;
    case 'lForgot':{const raw=$('lE')?.value.trim();if(!raw){toast('Bitte zuerst Benutzername oder E-Mail eintragen');break}const m=(await loginCandidates(raw)).find(realMail);if(!m){toast('Für diesen Benutzer ist keine E-Mail hinterlegt – bitte deinen Wahlleiter, dein Konto neu anzulegen.');break}try{await A.sendPasswordResetEmail(auth,m);toast('Falls das Konto existiert, kommt gleich eine Mail')}catch(x){toast(err(x))}break}
    case 'vLeave':leaveVoterRoom();break;
    case 'clr':pick=[];render();break;
    case 'cast':castVote();break;
    case 'vEdit':if(vRoom?.allowChange&&vRoom.status==='running'){editing=true;pick=[...vVote.choices];render()}break;
    case 'vCancel':editing=false;pick=[];render();break;
    case 'vDel':withdraw();break;
    case 'newRoom':createRoom();break;
    case 'aBack':closeAdminRoom();break;
    case 'pubOn':{busy=true;render();try{const c=await freeCode();await D.setDoc(D.doc(fs,'pubcodes',c),{room:aCode,approval:s.approvalPublic===true});await D.updateDoc(R(aCode),{pubCode:c});toast('Öffentlicher Code erstellt')}catch(x){toast(err(x))}busy=false;render();break}
    case 'pubOff':if(await ask('Öffentlichen Code abschalten?','Mit diesem Code kann danach niemand mehr beitreten. Wer schon im Raum ist, bleibt drin.','Abschalten')){busy=true;render();
      try{const c=s.pubCode;await D.updateDoc(R(aCode),{pubCode:null});try{await D.deleteDoc(D.doc(fs,'pubcodes',c))}catch(e){}toast('Öffentlicher Code abgeschaltet')}catch(x){toast(err(x))}busy=false;render()}break;
    case 'aAdd':draft.cands.push({id:'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:'',info:'',...(draft.kind==='person'?{offline:true}:{})});render();setTimeout(()=>{const l=document.querySelectorAll('[data-n]');l[l.length-1]?.focus()});break;
    case 'aSave':{const c=draft.cands.map(x=>({id:x.id,name:String(x.name||'').trim(),info:(x.info||'').trim(),...(x.uid?{uid:x.uid}:{}),...(x.offline?{offline:true}:{})})).filter(x=>x.name);
      if(!c.length){toast(draft.kind==='person'?'Mindestens eine Person zur Wahl stellen':'Mindestens eine Option eintragen');return}
      const patch={title:(draft.title||'').trim()||'Wahl',mode:draft.mode==='ranked'?'ranked':'free',max:Math.min(Math.max(1,parseInt(draft.max)||1),c.length),cands:c,allowChange:!!draft.allowChange,kind:draft.kind==='person'?'person':'option',candRule:draft.candRule==='none'?'none':'noself',candUids:c.filter(x=>x.uid).map(x=>x.uid)};
      draft=null;await saveRoom(patch);toast('Gespeichert');break}
    case 'aStart':if(await ask(s.status==='paused'?'Wahl fortsetzen?':'Wahl starten?','Ab jetzt können alle im Raum abstimmen.','Starten'))saveRoom({status:'running'});break;
    case 'aPause':saveRoom({status:'paused'});break;
    case 'aEnd':if(await ask('Wahl beenden?','Danach kann niemand mehr abstimmen.','Beenden'))saveRoom({status:'ended',entryOpen:false});break;
    case 'aPub':if(await ask('Ergebnis veröffentlichen?','Das Ergebnis wird für dich und alle im Raum sichtbar.','Veröffentlichen')){
      await saveRoom({status:'published',results:tally()})}break;
    case 'aPrint':if(aRes)exportPdf(protoData());break;
    case 'aArch':if(aRes&&!isSup&&aRoom?.owner!==me.uid){toast('Übernimm zuerst die Verantwortung für den Raum – das Protokoll gehört dem verantwortlichen Wahlleiter.');break}
      if(aRes){busy=true;render();try{await D.setDoc(D.doc(fs,'archive',`${aCode}_${aRes.publishedAt}`),{...protoData(),archivedAt:Date.now()});toast('Im Archiv gespeichert')}catch(x){toast(err(x))}busy=false;render()}break;
    case 'aDelRoom':deleteRoom();break;
    case 'oMe':case 'oSet':{const to=t.id==='oMe'?me.uid:$('oSel').value;if(!to||to===s.owner)break;const nm=to===me.uid?prof.name:nameOf(to);
      if(await ask(to===me.uid?'Verantwortung übernehmen?':'Verantwortung übergeben?',`${nm} ist dann verantwortlicher Wahlleiter dieses Raums und steht so im Protokoll. Alle Wahlleiter der Gruppe können den Raum weiter steuern.`,to===me.uid?'Übernehmen':'Übergeben'))saveRoom({owner:to,ownerName:nm});break}
    case 'tCancel':tDraft=null;applyTheme(curTheme);render();break;
    case 'tSave':saveTheme();break;
  }
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.dataset?.c){e.preventDefault();e.target.click()}});
document.addEventListener('input',e=>{const t=e.target;
  if(['tP','tC','tB','tA'].includes(t.id)&&tDraft){readDraft();applyTheme(tDraft);$('title').textContent=page==='themes'?'Designs':appName;return}
  if(!draft)return;
  if(t.dataset.n!==undefined)draft.cands[+t.dataset.n].name=t.value;
  else if(t.dataset.i!==undefined)draft.cands[+t.dataset.i].info=t.value;
  else if(t.id==='fMax')draft.max=t.value;else if(t.id==='fTitle')draft.title=t.value});
document.addEventListener('change',async e=>{const t=e.target;
  if(t.id==='myT'){try{await D.updateDoc(D.doc(fs,'users',me.uid),{theme:t.value||null});toast('Dein Design wurde geändert')}catch(x){toast(err(x))}return}
  if(t.dataset.ugrp){const u=staff.find(x=>x._id===t.dataset.ugrp);if(!u)return;const set=new Set(u.groups||[]);t.checked?set.add(t.value):set.delete(t.value);
    try{await D.updateDoc(D.doc(fs,'users',u._id),{groups:[...set]});toast('Gruppen geändert')}catch(x){t.checked=!t.checked;toast(err(x))}return}
  if(t.dataset.glead||t.dataset.ulead){const gid=t.dataset.glead||t.value,uid=t.dataset.glead?t.value:t.dataset.ulead;
    try{await setLeader(gid,uid,t.checked);toast(t.checked?'Zum Wahlleiter ernannt':'Wahlleiter entfernt')}catch(x){t.checked=!t.checked;toast(err(x))}return}
  if(t.dataset.gtheme){try{await D.updateDoc(D.doc(fs,'groups',t.dataset.gtheme),{theme:t.value||null});toast('Design der Gruppe geändert')}catch(x){toast(err(x))}return}
  if(t.dataset.gname){const g=grpOf(t.dataset.gname),nm=t.value.trim().slice(0,40);if(!g||!nm||nm===g.name){if(g)t.value=g.name;return}try{await D.updateDoc(D.doc(fs,'groups',g._id),{name:nm});toast('Name geändert')}catch(x){t.value=g.name;toast(err(x))}return}
  if(t.dataset.candu&&draft){const u=staff.find(x=>x._id===t.dataset.candu);if(!u||!(u.groups||[]).includes(aRoom?.group))return;
    if(t.checked){if(!draft.cands.some(c=>c.uid===u._id))draft.cands.push({id:'u_'+u._id,uid:u._id,name:u.name||'?',info:''})}else draft.cands=draft.cands.filter(c=>c.uid!==u._id);render();return}
  if(t.dataset.elig){try{await D.updateDoc(R(aCode,'members',t.dataset.elig),{elig:t.checked})}catch(x){t.checked=!t.checked;toast(err(x))}return}
  if(t.id==='aprG'){saveRoom({approvalGroup:t.checked});return}
  if(t.id==='aprP'){const c=aRoom?.pubCode;await saveRoom({approvalPublic:t.checked});if(c){try{await D.updateDoc(D.doc(fs,'pubcodes',c),{approval:t.checked})}catch(x){}}return}
  if(t.dataset.uname){const nm=t.value.trim().slice(0,60),u=staff.find(x=>x._id===t.dataset.uname);if(!nm||!u||nm===u.name){if(u)t.value=u.name;return}
    try{await D.updateDoc(D.doc(fs,'users',u._id),{name:nm});toast('Name geändert')}catch(x){t.value=u.name;toast(err(x))}return}
  if(t.id==='eOpen'){saveRoom({entryOpen:t.checked});return}
  if(!draft)return;if(t.id==='fChange')draft.allowChange=t.checked});
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target;
  if(f.id==='lf'){const raw=f.elements.lE.value,pw=f.elements.lP.value;busy=true;render();
    let ok=false,last=null;for(const em of await loginCandidates(raw)){try{await A.signInWithEmailAndPassword(auth,em,pw);ok=true;break}catch(x){last=x;if(x.code==='auth/too-many-requests')break}}
    if(!ok)toast(last?.code==='auth/too-many-requests'?'Zu viele Versuche – bitte kurz warten':'Anmeldung fehlgeschlagen – Benutzername oder Passwort falsch');busy=false;render()}
  if(f.id==='jf')joinRoom(f.elements.jC.value);
  if(f.id==='sf')createStaff(f);
  if(f.classList.contains('lf-new')){const gid=f.dataset.g;if(!leadGroups().some(g=>g._id===gid))return;const el=f.elements;busy=true;render();
    try{if(await createAccount(el.n.value,el.u.value,el.m.value,el.p.value,[gid]))f.reset()}catch(x){toast(err(x))}busy=false;render()}
  if(f.classList.contains('lf-add')){const gid=f.dataset.g,un=f.elements.u.value.trim().toLowerCase();if(!un||!leadGroups().some(g=>g._id===gid))return;
    const u=staff.find(x=>userOf(x)===un||String(x.email||'').toLowerCase()===un);
    if(!u){toast('Kein Konto mit diesem Benutzernamen gefunden');return}
    if((u.groups||[]).includes(gid)){toast(`${u.name} ist schon in der Gruppe`);return}
    busy=true;render();try{await setMembership(u._id,gid,true);toast(`${u.name} aufgenommen`);f.reset()}catch(x){toast(err(x))}busy=false;render()}
  if(f.id==='gf'){const nm=f.elements.gN.value.trim().slice(0,40),th=f.elements.gT.value||null,L=[...f.querySelectorAll('input[name=gL]:checked')].map(x=>x.value);
    if(!nm){toast('Bitte einen Namen eintragen');return}busy=true;render();
    try{await D.setDoc(D.doc(fs,'groups','g'+rnd(9)),{name:nm,theme:th,leaders:L,created:Date.now()});toast('Gruppe angelegt');f.reset()}catch(x){toast(err(x))}busy=false;render()}
  if(f.id==='emf'){const nm=f.elements.emNew.value.trim().toLowerCase(),pw=f.elements.emPw.value;
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(nm)||nm.endsWith('@'+LOGIN_DOMAIN)){toast('Bitte eine gültige E-Mail-Adresse eingeben');return}
    if(nm===String(me.email).toLowerCase()){toast('Diese Adresse ist schon hinterlegt');return}
    busy=true;render();
    try{const u=auth.currentUser;await A.reauthenticateWithCredential(u,A.EmailAuthProvider.credential(u.email,pw));
      const un=userOf(prof);if(un&&!un.includes('@')){try{await D.setDoc(D.doc(fs,'logins',un),{uid:me.uid,email:String(me.email).toLowerCase(),pending:nm})}catch(e){}}
      await A.verifyBeforeUpdateEmail(u,nm);toast(`Bestätigungslink an ${nm} gesendet – bitte Postfach prüfen`);f.reset()}
    catch(x){toast(['auth/wrong-password','auth/invalid-credential','auth/invalid-login-credentials'].includes(x.code)?'Aktuelles Passwort ist falsch':x.code==='auth/email-already-in-use'?'Diese E-Mail wird schon von einem anderen Konto benutzt':x.code==='auth/invalid-email'?'Ungültige E-Mail-Adresse':x.code==='auth/too-many-requests'?'Zu viele Versuche – bitte später erneut':err(x))}
    busy=false;render()}
  if(f.id==='cpf'){const el=f.elements,old=el.cpOld.value,n1=el.cpNew.value,n2=el.cpNew2.value;
    if(n1.length<6){toast('Das neue Passwort braucht mindestens 6 Zeichen');return}
    if(n1!==n2){toast('Die neuen Passwörter stimmen nicht überein');return}
    if(n1===old){toast('Das neue Passwort ist dasselbe wie das alte');return}
    busy=true;render();
    try{const u=auth.currentUser;await A.reauthenticateWithCredential(u,A.EmailAuthProvider.credential(u.email,old));await A.updatePassword(u,n1);toast('Passwort geändert');page='vote'}
    catch(x){toast(['auth/wrong-password','auth/invalid-credential','auth/invalid-login-credentials'].includes(x.code)?'Aktuelles Passwort ist falsch':x.code==='auth/weak-password'?'Neues Passwort ist zu schwach':x.code==='auth/too-many-requests'?'Zu viele Versuche – bitte später erneut':err(x))}
    busy=false;render()}
  if(f.id==='pf'){const nm=f.elements.pName.value.trim().slice(0,60);if(!nm)return;busy=true;render();
    try{await D.updateDoc(D.doc(fs,'users',me.uid),{name:nm});
      const own=myRooms.filter(r=>r.owner===me.uid);for(let i=0;i<own.length;i+=100){const b=D.writeBatch(fs);own.slice(i,i+100).forEach(r=>b.update(R(r._id),{ownerName:nm}));await b.commit()}
      toast('Name gespeichert')}catch(x){toast(err(x))}busy=false;render()}
});

/* ---------- Start ---------- */
(async()=>{
  try{[F,A,D]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')])}
  catch(e){$('main').innerHTML=`<div class="sheet"><p class="hint">Konnte nicht laden. Bitte Internetverbindung prüfen und neu öffnen.</p></div>`;return}
  app=F.initializeApp(firebaseConfig);auth=A.getAuth(app);fs=D.getFirestore(app);
  let profUnsub=null;
  A.onAuthStateChanged(auth,async u=>{
    off(gUnsub);if(profUnsub){profUnsub();profUnsub=null}
    me=u&&!u.isAnonymous?u:null;prof=null;isSup=false;isAdm=false;
    if(u?.isAnonymous){await A.signOut(auth);return}
    if(!me){if(themeUnsub){themeUnsub();themeUnsub=null}themeId=null;authReady=true;render();return}
    isSup=me.uid===SUPER_UID;
    if(isSup){try{const p=await D.getDoc(D.doc(fs,'users',me.uid));if(!p.exists())await D.setDoc(D.doc(fs,'users',me.uid),{name:'Hauptwahlleiter',email:me.email||'',groups:[],leads:[],theme:null,created:Date.now()})}catch(e){}}
    let first=true,wasAdm=null;
    profUnsub=D.onSnapshot(D.doc(fs,'users',me.uid),s=>{
      prof=s.exists()?s.data():null;isAdm=!!prof&&(isSup||(prof.leads||[]).length>0);
      if(isAdm!==wasAdm){wasAdm=isAdm;off(gUnsub);if(prof)startGlobal();if(!isAdm&&page!=='vote'){off(aUnsub);aCode=null;page='vote'}}
      if(first&&prof)syncEmail();
      if(first&&prof){first=false;if(pendingRoom&&!vCode){history.replaceState(null,'',baseUrl());joinRoom(pendingRoom)}}
      authReady=true;render();
    },()=>{prof=null;authReady=true;render()});
  });
})();
</script>
